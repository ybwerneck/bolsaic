[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gotranx_gpu"
version = "0.1.0"
description = "PyTorch and numba (njit + CUDA) backends for gotranx cell models"
requires-python = ">=3.10"
dependencies = ["gotranx>=2.6", "numpy"]

[project.optional-dependencies]
torch = ["torch"]
numba = ["numba", "numba-cuda[cu12]"]
test = ["pytest"]

[project.scripts]
gotranx_gpu = "gotranx_gpu.generate:main"

[tool.setuptools.packages.find]
where = ["src"]
